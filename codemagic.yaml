workflows:
  android-workflow:
    name: Build Vista Browser APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Install Gradle and Build APK
        script: |
          # If gradlew wrapper is missing, install gradle and generate it
          if [ ! -f "gradlew" ]; then
            echo "Installing Gradle..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper
            chmod +x gradlew
          else
            chmod +x gradlew
          fi

          # Run the build
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk
