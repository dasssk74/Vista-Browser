workflows:
  android-workflow:
    name: Build Vista Browser APK
    max_build_duration: 60
    instance_type: linux_x2
    scripts:
      - name: Make gradlew executable
        script: |
          chmod +x gradlew
      - name: Build Android APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
