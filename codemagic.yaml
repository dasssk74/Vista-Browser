workflows:
  android-workflow:
    name: Build Vista Browser APK
    max_build_duration: 60
    instance_type: linux
    environment:
      java: 17
      android_sdk: 34
    scripts:
      - name: Build APK
        script: |
          set -e
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi
    artifacts:
      - app/build/outputs/apk/debug/*.apk
